<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RSVP - COLLIN XANDER</title>
<meta name="description" content="RSVP for the Aura Solo Photo + Visual Exhibition by Collin Xander.">
<link rel="icon" href="assets/shared/profilepic.jpg" type="image/jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght,CNTR@1,700,75&family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: { extend: {
    colors: { ink: '#0b0b0c', line: 'rgba(255,255,255,.09)', red: '#e50914', mute: '#9a9aa2' },
    fontFamily: { display: ['"Bebas Neue"', 'Impact', 'sans-serif'], sans: ['"DM Sans"', 'system-ui', 'sans-serif'], anybody: ['"Anybody"', 'sans-serif'] }
  } }
};
</script>
<style>
  .focus-ring:focus-visible { outline:2px solid #e50914; outline-offset:3px; }
  @keyframes rise { from { opacity:0; transform:translateY(24px) } to { opacity:1; transform:none } }
  .rise { animation: rise .9s cubic-bezier(.2,.7,.2,1) both }
  @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important } }
</style>
</head>
<body class="bg-black font-sans text-white antialiased">

<!-- Background video -->
<video autoplay muted loop playsinline class="fixed inset-0 -z-10 h-full w-full object-cover">
    <source src="rsvp/rsvp.MP4" type="video/mp4">
</video>
<div class="fixed inset-0 -z-10 bg-black/35" aria-hidden="true"></div>

<header id="header" class="fixed inset-x-0 top-0 z-50 h-16 md:h-[72px] border-b border-transparent transition-colors duration-300">
  <div class="mx-auto flex h-full max-w-7xl items-center justify-between px-5 md:px-8">
    <a href="./" class="font-display italic text-3xl tracking-[.12em] text-red hover:text-white transition-colors focus-ring">COLLIN XANDER</a>
    <button id="menu-toggle" class="md:hidden grid h-10 w-10 place-items-center rounded-lg hover:bg-white/10 focus-ring" aria-label="Toggle navigation" aria-expanded="false" aria-controls="nav">
      <i class="fas fa-bars" aria-hidden="true"></i>
    </button>
    <nav id="nav" aria-label="Main navigation" class="hidden md:flex absolute md:static top-full inset-x-0 flex-col md:flex-row md:items-center gap-1 bg-ink/95 md:bg-transparent backdrop-blur-xl md:backdrop-blur-none border-b md:border-0 border-line p-4 md:p-0">
      <a href="./" class="rounded-lg px-4 py-2 text-sm font-medium text-mute hover:text-white hover:bg-white/5 focus-ring">Home</a>
      <a href="./Photos" class="rounded-lg px-4 py-2 text-sm font-medium text-mute hover:text-white hover:bg-white/5 focus-ring">Photos</a>
      <a href="./videos" class="rounded-lg px-4 py-2 text-sm font-medium text-mute hover:text-white hover:bg-white/5 focus-ring">Videos</a>
      <a href="./About" class="rounded-lg px-4 py-2 text-sm font-medium text-mute hover:text-white hover:bg-white/5 focus-ring">About</a>
      <a href="./Bookings" class="mt-2 md:mt-0 md:ml-3 rounded-full bg-red px-5 py-2 text-center text-sm font-bold hover:bg-white hover:text-ink transition-colors focus-ring">Book now</a>
    </nav>
  </div>
</header>

<main class="flex min-h-screen items-center justify-center px-6 pb-16 pt-24 text-center">
  <div>
    <p class="rise text-sm font-bold uppercase tracking-[.3em] text-red">You're invited</p>
    <h1 class="rise mt-4 font-display text-[clamp(2.8rem,10vw,7.5rem)] leading-[.9] tracking-[.03em]" style="animation-delay:.1s">
     <span class="block font-anybody italic text-red text-[0.55em]" style="font-stretch:75%">"Aura"</span> Solo<br>Photo + Visual Exhibition
    </h1>
    <a href="https://posh.vip/e/aura-solo-photo-visual-exhibition" target="_blank" rel="noopener noreferrer"
       class="rise mt-10 inline-flex items-center gap-3 rounded-full bg-red px-12 py-4 font-display text-3xl tracking-[.15em] transition-colors hover:bg-white hover:text-black focus-ring"
       style="animation-delay:.25s">
      RSVP <i class="fas fa-arrow-right text-xl" aria-hidden="true"></i>
      <span class="sr-only">(opens in a new tab)</span>
    </a>
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const header = $('header'), nav = $('nav'), toggle = $('menu-toggle');
  const onScroll = () => {
    const s = scrollY > 40;
    header.classList.toggle('bg-ink/90', s); header.classList.toggle('backdrop-blur-xl', s);
    header.classList.toggle('border-line', s); header.classList.toggle('border-transparent', !s);
  };
  addEventListener('scroll', onScroll, { passive: true }); onScroll();
  const setMenu = open => {
    nav.classList.toggle('hidden', !open); nav.classList.toggle('flex', open);
    toggle.setAttribute('aria-expanded', open);
    toggle.firstElementChild.className = open ? 'fas fa-times' : 'fas fa-bars';
  };
  toggle.addEventListener('click', () => setMenu(toggle.getAttribute('aria-expanded') !== 'true'));
  document.addEventListener('click', e => { if (!header.contains(e.target)) setMenu(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

  const v = $('bg-video');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) v.pause();
  else v.play().catch(() => {});
})();
</script>
</body>
</html>
